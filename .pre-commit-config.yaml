exclude: |
  (?x)^(
    binary-projects/|
    source-projects/.*/(build|target|bin)/|
    source-projects/.*/gradle/wrapper/gradle-wrapper\.jar
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=4096"]
